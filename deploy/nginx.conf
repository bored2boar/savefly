# Serving SAVEFLY. Critical spots are marked.
server {
  listen 443 ssl http2;
  server_name savefly.example;

  root /opt/savefly;
  add_header Access-Control-Allow-Origin "*" always;
  # WITHOUT THIS Range resumption does not work in the browser, and the client
  # pulls the whole tail shard every time instead of the increment
  add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length" always;

  # Game
  location = / {
    alias /opt/savefly/src/savefly.html;
    add_header Cache-Control "public, max-age=60";
  }

  # Log head. MUST NOT BE CACHED: it lists the shards, and if
  # a CDN caches it, clients will not see rotation and will lose the feed.
  location = /data/meta.json {
    add_header Cache-Control "no-cache, must-revalidate";
    add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges" always;
  }

  # State snapshot - changes every few minutes
  location = /data/state.json {
    add_header Cache-Control "public, max-age=5";
  }

  # Log shards. The tail one grows, so no-cache on the whole directory:
  # simpler than telling a closed shard from the active one, and
  # Range increments keep traffic small anyway.
  location /data/events/ {
    add_header Cache-Control "no-cache";
    add_header Accept-Ranges "bytes";
    add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length" always;
  }

  # Archives and the death registry - immutable
  location /data/events/A/archive/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The client does not need the snapshot log, but keep it available
  # for verification via tools/verify.js
  location = /data/checkpoints.jsonl {
    add_header Cache-Control "public, max-age=30";
  }
}
